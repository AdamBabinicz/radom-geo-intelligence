modules:
  rovo:agent:
    - key: northstar-ops-geo-strategist
      name: Northstar Ops Geo Strategist
      description: >
        AI Geo-Intelligence & Pricing Strategist for local service operators.
        Audits local markets, reads live Jira/Confluence context, calculates
        multi-currency zone travel fees, publishes playbooks to Confluence, and
        creates execution campaigns in Jira.
      prompt: >
        You are Northstar Ops Geo Strategist, an operational Atlassian Rovo
        teammate for local service businesses (such as upholstery & carpet
        cleaning, HVAC, plumbing, or any custom service niche).
        Follow these rules:
        1. When a user asks about a city, service radius, regional pricing,
           competitors, or recent Jira/Confluence activity, call
           get-market-brief first to load benchmarks, radius coverage
           (10-100 km), customer pain points, and live Jira issues + Confluence
           pages in the workspace.
        2. When asked to quote a customer order or estimate a travel fee for a
           town, call calculate-service-fee with town, orderValue, radiusKm,
           optional distanceKm, and optional currency (PLN, USD, EUR, or GBP).
        3. When asked to document a strategy or export a report to Confluence,
           call publish-confluence-playbook. Use spaceKey "northstarg" if the
           user does not specify another space.
        4. When asked to create marketing or operational expansion tasks in
           Jira, call create-jira-campaign. Use projectKey "KAN" if the
           user does not specify another project. Provide 3 to 4 concrete tasks
           separated by semicolons in actionItems.
        5. Reply concisely in the user's language (Polish or English) with
           concrete numbers and links/keys of any created pages or Jira issues.
      conversationStarters:
        - Audit the Radom upholstery market within 30 km and check recent Jira quotes
        - Calculate a 250 USD quote with travel fee for a town 22 km away
        - Publish a Northstar Ops strategy playbook to Confluence space northstarg
        - Create a local expansion campaign in Jira project KAN
      actions:
        - get-market-brief
        - calculate-service-fee
        - publish-confluence-playbook
        - create-jira-campaign
      skills:
        - geo-pricing-strategist

  rovo:skill:
    - key: geo-pricing-strategist
      source:
        dir: skills/geo-pricing-strategist
      dependencies:
        tools:
          - get-market-brief
          - calculate-service-fee
          - publish-confluence-playbook
          - create-jira-campaign

  rovo:mcp:
    - key: northstar-ops-mcp
      name: Northstar Ops MCP Server
      tools:
        - get-market-brief
        - calculate-service-fee
        - publish-confluence-playbook
        - create-jira-campaign

  action:
    - key: get-market-brief
      name: Get Northstar Ops Market Brief
      function: getMarketBriefFn
      actionVerb: GET
      description: >
        Retrieves Northstar Ops geo-intelligence benchmarks, radius coverage,
        customer pain points, and live Jira issues + Confluence pages from the
        workspace.
      inputs:
        city:
          title: City
          type: string
          required: true
          description: Target city name (e.g. Radom, Krakow, London, Austin)
        industry:
          title: Industry
          type: string
          required: true
          description: Service industry key (upholstery, hvac, plumbing) or any custom niche
        radiusKm:
          title: Radius (km)
          type: number
          required: false
          description: Operational coverage radius in kilometers (10-100)
        currency:
          title: Currency
          type: string
          required: false
          description: Output currency code (PLN, USD, EUR, or GBP)
        spaceKey:
          title: Confluence Space Key
          type: string
          required: false
          description: Optional Confluence space key (defaults to northstarg or workspace fallback)
        projectKey:
          title: Jira Project Key
          type: string
          required: false
          description: Optional Jira project key (defaults to KAN or workspace fallback)

    - key: calculate-service-fee
      name: Calculate Zone Service Fee
      function: calculateServiceFeeFn
      actionVerb: GET
      description: >
        Calculates zone travel fee, drive-time estimate, and total customer
        quote for any town, order value, radius, and currency.
      inputs:
        town:
          title: Town
          type: string
          required: true
          description: Target service town (e.g. Pionki, Jedlinsk, or any local town)
        orderValue:
          title: Order Value
          type: number
          required: true
          description: Base order value before travel surcharge
        radiusKm:
          title: Radius (km)
          type: number
          required: false
          description: Active operational radius in kilometers (10-100, default 30)
        distanceKm:
          title: Distance (km)
          type: number
          required: false
          description: Straight-line distance in km from the operations center
        currency:
          title: Currency
          type: string
          required: false
          description: Quote currency code (PLN, USD, EUR, or GBP)

    - key: publish-confluence-playbook
      name: Publish Confluence Strategy Playbook
      function: publishPlaybookFn
      actionVerb: CREATE
      description: >
        Creates a formatted strategy playbook page inside Atlassian Confluence
        with local pricing context and service expansion priorities.
      inputs:
        title:
          title: Page Title
          type: string
          required: true
          description: Clear title for the new Confluence strategy page
        city:
          title: City
          type: string
          required: true
          description: City analyzed in this strategy playbook
        industry:
          title: Industry
          type: string
          required: true
          description: Service industry key or custom service niche
        summary:
          title: Strategy Summary
          type: string
          required: true
          description: Executive summary, recommended prices, and rollout plan
        radiusKm:
          title: Radius (km)
          type: number
          required: false
          description: Operational coverage radius in kilometers (10-100)
        currency:
          title: Currency
          type: string
          required: false
          description: Currency code for benchmarks (PLN, USD, EUR, or GBP)
        spaceKey:
          title: Confluence Space Key
          type: string
          required: false
          description: Optional Confluence space key (defaults to northstarg)

    - key: create-jira-campaign
      name: Create Jira Expansion Campaign
      function: createCampaignFn
      actionVerb: CREATE
      description: >
        Creates a Jira Epic and operational tasks in the target project for
        executing a local pricing update or regional geo-marketing campaign.
      inputs:
        campaignTitle:
          title: Campaign Title
          type: string
          required: true
          description: Name of the pricing or regional expansion campaign
        city:
          title: City
          type: string
          required: true
          description: Target city for the campaign
        industry:
          title: Industry
          type: string
          required: true
          description: Service industry key or custom service niche
        actionItems:
          title: Action Items
          type: string
          required: true
          description: Semicolon-separated list of concrete tasks to create in Jira
        projectKey:
          title: Jira Project Key
          type: string
          required: false
          description: Optional Jira project key (defaults to KAN)

  function:
    - key: getMarketBriefFn
      handler: index.getMarketBrief
    - key: calculateServiceFeeFn
      handler: index.calculateServiceFee
    - key: publishPlaybookFn
      handler: index.publishConfluencePlaybook
    - key: createCampaignFn
      handler: index.createJiraCampaign

permissions:
  scopes:
    - read:space:confluence
    - read:page:confluence
    - write:page:confluence
    - read:jira-work
    - write:jira-work

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/0f3e249d-8d6d-42b2-a2a8-dc3aa49696d0
